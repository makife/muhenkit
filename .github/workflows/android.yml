name: Android

on:
  push:
    branches: [main]
    paths: ["android/**", "core/**", ".github/workflows/android.yml", ".github/play_upload.py"]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      # Android SDK çalıştırıcıda hazır ($ANDROID_HOME); yalnızca NDK ve CMake eklenir
      - name: NDK ve CMake
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;28.2.13676358" "cmake;3.22.1" > /dev/null
      - name: Yükleme anahtarı
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            printf '%s' "$KS_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::ANDROID_KEYSTORE_B64 yok: debug anahtarıyla imzalanır (Play kabul etmez)"
          fi
      - name: APK ve AAB derle
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          # Play her yüklemede daha büyük sürüm kodu ister
          VERSION_CODE: ${{ github.run_number }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease bundleRelease --no-daemon
      - uses: actions/upload-artifact@v5
        with:
          name: MuhenKit-android
          path: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/bundle/release/*.aab
      # Play Console: Kapalı test (alpha) kanalına yükle. Hizmet hesabı Play'de "Test kanallarına yayınlama" izinli.
      # İlk AAB Play'e elle yüklenmiş olmalı (API yeni paketi tanımıyor: "Package not found").
      - name: Google Play'e yükle (Kapalı test)
        env:
          PLAY_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$PLAY_JSON" ]; then echo "::warning::PLAY_SERVICE_ACCOUNT_JSON yok: Play'e yüklenmedi"; exit 0; fi
          printf '%s' "$PLAY_JSON" > "$RUNNER_TEMP/play.json"
          pip install --quiet pyjwt cryptography
          set +e  # hata kodunu kendimiz değerlendiriyoruz (varsayılan kabuk -e -o pipefail)
          python3 .github/play_upload.py "$RUNNER_TEMP/play.json" com.muhenkit.app \
            android/app/build/outputs/bundle/release/app-release.aab alpha 2>&1 | tee play.log
          rc=${PIPESTATUS[0]}
          rm -f "$RUNNER_TEMP/play.json"
          if grep -q "Package not found" play.log; then echo "::warning::Play paketi tanımıyor: ilk AAB'yi Play Console'a elle yükleyin"; exit 0; fi
          [ $rc -eq 0 ] && echo "::notice::$(tail -1 play.log)" || { echo "::error::Play yüklemesi: $(tail -1 play.log)"; exit $rc; }
