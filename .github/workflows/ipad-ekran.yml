name: iPad ekran görüntüleri

# Mağaza için gerçek iPad görüntüleri: iPad Pro 13" simülatöründe uygulamayı ekran ekran açıp çeker (elle başlatılır).
# Uygulama `-mkScreen <ekran>` açılış parametresiyle ilgili ekranı (örnek projeyle) açar.
on:
  workflow_dispatch:
    inputs:
      cihaz:
        description: "Simülatör adı içinde aranacak metin"
        default: "iPad Pro 13"

jobs:
  shots:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - name: Xcode 26 seç
        run: |
          X=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          [ -n "$X" ] && sudo xcode-select -s "$X"
          xcodebuild -version
      - name: Simülatör için derle
        working-directory: apple
        run: |
          brew install xcodegen
          xcodegen generate
          UDID=$(xcrun simctl list devices available | grep "${{ inputs.cihaz }}" | head -1 | grep -oE '[0-9A-F-]{36}')
          echo "cihaz: $(xcrun simctl list devices available | grep "${{ inputs.cihaz }}" | head -1)"
          [ -n "$UDID" ] || { xcrun simctl list devices available; echo "::error::Simülatör bulunamadı"; exit 1; }
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          xcodebuild -project MuhenKit.xcodeproj -scheme MuhenKit-iOS -configuration Release -sdk iphonesimulator \
            -destination "id=$UDID" -derivedDataPath build CODE_SIGNING_ALLOWED=NO build > sim.log 2>&1 \
            || { bash ../.github/report.sh sim.log; exit 1; }
      - name: Ekranları çek
        working-directory: apple
        run: |
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl status_bar "$UDID" override --time "9:41" --batteryState charged --batteryLevel 100 --cellularBars 4 --wifiBars 3 || true
          APP=$(ls -d build/Build/Products/Release-iphonesimulator/*.app | head -1)
          xcrun simctl install "$UDID" "$APP"
          BID=com.ergan.muhenkitelektrik
          mkdir -p shots
          i=1
          for s in home cad projects lighting load drop grounding lux; do
            xcrun simctl terminate "$UDID" "$BID" 2>/dev/null || true
            xcrun simctl launch "$UDID" "$BID" -mkScreen "$s"
            sleep 9
            xcrun simctl io "$UDID" screenshot "shots/$i.png"
            echo "$i: $s"
            i=$((i+1))
          done
      - uses: actions/upload-artifact@v5
        with:
          name: ipad-ekranlar
          path: apple/shots/
