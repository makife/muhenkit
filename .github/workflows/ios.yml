name: iOS

# iPhone + iPad uygulaması. Her apple/core gönderiminde derlenip TestFlight'a yüklenir.
# Elle başlatırken "islem" seçilir:
#   yukle      → derle ve TestFlight'a yükle (varsayılan)
#   durum      → App Store Connect'teki yapıların işleme durumu (iOS + Mac) — "TestFlight'ta yok" denirse önce buna bak
#   ekran      → iPad Pro 13" simülatöründe mağaza ekran görüntüleri (uygulama -mkScreen ile ekranı örnek projeyle açar)
# Yükleme: arşiv imzasız alınır, dağıtım imzasını exportArchive API anahtarıyla kendisi oluşturur, .ipa App Store Connect
# API (Build Uploads, .github/asc_upload.py) ile gider (altool JWT'yi reddediyor).
# Gizliler: ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8, APPLE_TEAM_ID
on:
  push:
    branches: [main]
    paths: ["apple/**", "core/**", ".github/workflows/ios.yml", ".github/asc_upload.py", ".github/report.sh"]
  workflow_dispatch:
    inputs:
      islem:
        description: "Ne yapılsın"
        type: choice
        options: [yukle, durum, ekran]
        default: yukle

jobs:
  testflight:
    if: github.event_name == 'push' || inputs.islem == 'yukle'
    runs-on: macos-26
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
      TEAM: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v5
      - name: Xcode 26 seç
        run: |
          X=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          [ -n "$X" ] && sudo xcode-select -s "$X"
          xcodebuild -version
      - name: Arşivle ve yükle
        working-directory: apple
        run: |
          brew install xcodegen
          xcodegen generate
          # yapı numarası: eski testflight.yml yapı 26'ya ulaştı; yeni iş akışının sayacı 1'den başlar → +100
          BUILD=$((GITHUB_RUN_NUMBER + 100))
          # gizlilere yapıştırırken kalmış boşluk / satır sonlarını temizle
          export ASC_KEY_ID=$(printf '%s' "$ASC_KEY_ID" | tr -d '[:space:]') ASC_ISSUER_ID=$(printf '%s' "$ASC_ISSUER_ID" | tr -d '[:space:]') TEAM=$(printf '%s' "$TEAM" | tr -d '[:space:]')
          # yükleme araçları anahtarı ~/private_keys altında arar
          mkdir -p ~/private_keys
          export KEY="$HOME/private_keys/AuthKey_$ASC_KEY_ID.p8"
          # Windows'tan yapıştırılmış olabilir: \r ve satır başı/sonu boşluklarını temizle, PEM biçimini koru
          printf '%s\n' "$ASC_KEY_P8" | tr -d '\r' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' | grep -v '^$' > "$KEY"
          head -1 "$KEY"; tail -1 "$KEY"; echo "anahtar satır sayısı: $(wc -l < "$KEY")"
          AUTH=(-allowProvisioningUpdates -authenticationKeyPath "$KEY" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID")
          xcodebuild -project MuhenKit.xcodeproj -scheme MuhenKit-iOS -configuration Release \
            -destination 'generic/platform=iOS' -archivePath build/MuhenKit.xcarchive \
            DEVELOPMENT_TEAM="$TEAM" CURRENT_PROJECT_VERSION="$BUILD" CODE_SIGNING_ALLOWED=NO \
            archive > archive.log 2>&1 || { bash ../.github/report.sh archive.log; exit 1; }
          cat > ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>export</string>
            <key>teamID</key><string>$TEAM</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
            <key>uploadSymbols</key><false/>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath build/MuhenKit.xcarchive -exportOptionsPlist ExportOptions.plist \
            -exportPath build/export "${AUTH[@]}" > export.log 2>&1 || { bash ../.github/report.sh export.log; exit 1; }
          IPA=$(ls build/export/*.ipa | head -1)
          # yükleme: App Store Connect API (Build Uploads) — altool anahtarı reddettiği için doğrudan REST
          VER=$(/usr/libexec/PlistBuddy -c "Print :ApplicationProperties:CFBundleShortVersionString" build/MuhenKit.xcarchive/Info.plist)
          python3 -m pip install --quiet --break-system-packages pyjwt cryptography 2>/dev/null || python3 -m pip install --quiet pyjwt cryptography
          python3 ../.github/asc_upload.py "$IPA" 6823229508 "$VER" "$BUILD" > upload.log 2>&1 \
            || { cat upload.log; bash ../.github/report.sh upload.log; exit 1; }
          cat upload.log
          echo "::notice::Yüklendi: yapı $BUILD. App Store Connect işledikten sonra (5-15 dk) TestFlight'ta görünür."

  durum:
    if: inputs.islem == 'durum'
    runs-on: ubuntu-latest
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
    steps:
      - uses: actions/checkout@v5
      - name: Durum
        run: |
          export ASC_KEY_ID=$(printf '%s' "$ASC_KEY_ID" | tr -d '[:space:]') ASC_ISSUER_ID=$(printf '%s' "$ASC_ISSUER_ID" | tr -d '[:space:]')
          export KEY="$RUNNER_TEMP/key.p8"
          printf '%s\n' "$ASC_KEY_P8" | tr -d '\r' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' | grep -v '^$' > "$KEY"
          pip install --quiet pyjwt cryptography
          for APP in 6823229508 ${{ vars.ASC_MAC_APP_ID }}; do
            echo "== $APP" | tee -a status.log
            python3 .github/asc_status.py "$APP" | tee -a status.log
          done
          echo "::notice title=Durum::$(tr '\n' '|' < status.log | cut -c1-3000)"

  ekran:
    if: inputs.islem == 'ekran'
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - name: Xcode 26 seç
        run: |
          X=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          [ -n "$X" ] && sudo xcode-select -s "$X"
          xcodebuild -version
      - name: Simülatör için derle
        working-directory: apple
        run: |
          brew install xcodegen
          xcodegen generate
          UDID=$(xcrun simctl list devices available | grep "iPad Pro 13" | head -1 | grep -oE '[0-9A-F-]{36}')
          echo "cihaz: $(xcrun simctl list devices available | grep "iPad Pro 13" | head -1)"
          [ -n "$UDID" ] || { xcrun simctl list devices available; echo "::error::Simülatör bulunamadı"; exit 1; }
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          xcodebuild -project MuhenKit.xcodeproj -scheme MuhenKit-iOS -configuration Release -sdk iphonesimulator \
            -destination "id=$UDID" -derivedDataPath build CODE_SIGNING_ALLOWED=NO build > sim.log 2>&1 \
            || { bash ../.github/report.sh sim.log; exit 1; }
      - name: Ekranları çek
        working-directory: apple
        run: |
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl status_bar "$UDID" override --time "9:41" --batteryState charged --batteryLevel 100 --cellularBars 4 --wifiBars 3 || true
          APP=$(ls -d build/Build/Products/Release-iphonesimulator/*.app | head -1)
          xcrun simctl install "$UDID" "$APP"
          BID=com.ergan.muhenkitelektrik
          mkdir -p shots
          i=1
          for s in home cad projects lighting load drop grounding lux; do
            xcrun simctl terminate "$UDID" "$BID" 2>/dev/null || true
            xcrun simctl launch "$UDID" "$BID" -mkScreen "$s"
            sleep 9
            xcrun simctl io "$UDID" screenshot "shots/$i.png"
            echo "$i: $s"
            i=$((i+1))
          done
      - uses: actions/upload-artifact@v5
        with:
          name: ipad-ekranlar
          path: apple/shots/
