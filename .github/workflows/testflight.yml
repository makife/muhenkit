name: TestFlight

# iOS sürümünü App Store Connect'e (TestFlight) yükler: arşiv imzasız alınır; dağıtım imzasını
# (sertifika + profil) dışa aktarma adımı API anahtarıyla kendisi oluşturur — cihaz kaydı gerekmez.
# .ipa sonra App Store Connect API (Build Uploads) ile yüklenir (altool JWT'yi reddettiği için).
# Gereken depo gizlileri (Settings → Secrets and variables → Actions):
#   ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8 (AuthKey_XXXX.p8 dosyasının içeriği), APPLE_TEAM_ID
on:
  push:
    branches: [main]
    paths: ["apple/**", "core/**", ".github/workflows/testflight.yml", ".github/asc_upload.py"]
  workflow_dispatch:

jobs:
  upload:
    runs-on: macos-26
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
      TEAM: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - name: Gizliler var mı
        id: check
        run: |
          if [ -n "$ASC_KEY_ID" ] && [ -n "$ASC_ISSUER_ID" ] && [ -n "$ASC_KEY_P8" ] && [ -n "$TEAM" ]; then
            echo "ok=1" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::TestFlight gizlileri henüz eklenmedi; yükleme atlandı."
          fi
      - uses: actions/checkout@v5
      - name: Xcode 26 seç
        run: |
          X=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          [ -n "$X" ] && sudo xcode-select -s "$X"
          xcodebuild -version
        if: steps.check.outputs.ok == '1'
      - name: Arşivle ve yükle
        if: steps.check.outputs.ok == '1'
        working-directory: apple
        run: |
          brew install xcodegen
          xcodegen generate
          # gizlilere yapıştırırken kalmış boşluk / satır sonlarını temizle
          export ASC_KEY_ID=$(printf '%s' "$ASC_KEY_ID" | tr -d '[:space:]') ASC_ISSUER_ID=$(printf '%s' "$ASC_ISSUER_ID" | tr -d '[:space:]') TEAM=$(printf '%s' "$TEAM" | tr -d '[:space:]')
          # yükleme araçları anahtarı ~/private_keys altında arar
          mkdir -p ~/private_keys
          export KEY="$HOME/private_keys/AuthKey_$ASC_KEY_ID.p8"
          # Windows'tan yapıştırılmış olabilir: \r ve satır başı/sonu boşluklarını temizle, PEM biçimini koru
          printf '%s\n' "$ASC_KEY_P8" | tr -d '\r' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' | grep -v '^$' > "$KEY"
          head -1 "$KEY"; tail -1 "$KEY"; echo "anahtar satır sayısı: $(wc -l < "$KEY")"
          AUTH=(-allowProvisioningUpdates -authenticationKeyPath "$KEY" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID")
          xcodebuild -project MuhenKit.xcodeproj -scheme MuhenKit-iOS -configuration Release \
            -destination 'generic/platform=iOS' -archivePath build/MuhenKit.xcarchive \
            DEVELOPMENT_TEAM="$TEAM" CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" CODE_SIGNING_ALLOWED=NO \
            archive > archive.log 2>&1 || { bash ../.github/report.sh archive.log; exit 1; }
          cat > ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>export</string>
            <key>teamID</key><string>$TEAM</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
            <key>uploadSymbols</key><false/>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath build/MuhenKit.xcarchive -exportOptionsPlist ExportOptions.plist \
            -exportPath build/export "${AUTH[@]}" > export.log 2>&1 || { bash ../.github/report.sh export.log; exit 1; }
          IPA=$(ls build/export/*.ipa | head -1)
          # yükleme: App Store Connect API (Build Uploads) — altool anahtarı reddettiği için doğrudan REST
          VER=$(/usr/libexec/PlistBuddy -c "Print :ApplicationProperties:CFBundleShortVersionString" build/MuhenKit.xcarchive/Info.plist)
          python3 -m pip install --quiet --break-system-packages pyjwt cryptography 2>/dev/null || python3 -m pip install --quiet pyjwt cryptography
          python3 ../.github/asc_upload.py "$IPA" 6823229508 "$VER" "$GITHUB_RUN_NUMBER" > upload.log 2>&1 \
            || { cat upload.log; bash ../.github/report.sh upload.log; exit 1; }
          cat upload.log
          echo "::notice::Yüklendi: yapı $GITHUB_RUN_NUMBER. App Store Connect işledikten sonra (5-15 dk) TestFlight'ta görünür."

  # Mac App Store (ayrı uygulama kaydı, ayrı satış). Depo değişkeni ASC_MAC_APP_ID tanımlanınca çalışır.
  mac:
    if: vars.ASC_MAC_APP_ID != ''
    runs-on: macos-26
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
      TEAM: ${{ secrets.APPLE_TEAM_ID }}
      MAC_APP_ID: ${{ vars.ASC_MAC_APP_ID }}
    steps:
      - uses: actions/checkout@v5
      - name: Xcode 26 seç
        run: |
          X=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          [ -n "$X" ] && sudo xcode-select -s "$X"
          xcodebuild -version
      - name: Arşivle ve yükle (macOS)
        working-directory: apple
        run: |
          brew install xcodegen
          xcodegen generate
          export ASC_KEY_ID=$(printf '%s' "$ASC_KEY_ID" | tr -d '[:space:]') ASC_ISSUER_ID=$(printf '%s' "$ASC_ISSUER_ID" | tr -d '[:space:]') TEAM=$(printf '%s' "$TEAM" | tr -d '[:space:]')
          mkdir -p ~/private_keys
          export KEY="$HOME/private_keys/AuthKey_$ASC_KEY_ID.p8"
          printf '%s\n' "$ASC_KEY_P8" | tr -d '\r' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' | grep -v '^$' > "$KEY"
          AUTH=(-allowProvisioningUpdates -authenticationKeyPath "$KEY" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID")
          xcodebuild -project MuhenKit.xcodeproj -scheme MuhenKit-macOS -configuration Release \
            -destination 'generic/platform=macOS' -archivePath build/MuhenKitMac.xcarchive \
            DEVELOPMENT_TEAM="$TEAM" CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" CODE_SIGNING_ALLOWED=NO \
            archive > archive.log 2>&1 || { bash ../.github/report.sh archive.log; exit 1; }
          cat > ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>export</string>
            <key>teamID</key><string>$TEAM</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath build/MuhenKitMac.xcarchive -exportOptionsPlist ExportOptions.plist \
            -exportPath build/export "${AUTH[@]}" > export.log 2>&1 || { bash ../.github/report.sh export.log; exit 1; }
          PKG=$(ls build/export/*.pkg | head -1)
          VER=$(/usr/libexec/PlistBuddy -c "Print :ApplicationProperties:CFBundleShortVersionString" build/MuhenKitMac.xcarchive/Info.plist)
          python3 -m pip install --quiet --break-system-packages pyjwt cryptography 2>/dev/null || python3 -m pip install --quiet pyjwt cryptography
          python3 ../.github/asc_upload.py "$PKG" "$MAC_APP_ID" "$VER" "$GITHUB_RUN_NUMBER" MAC_OS > upload.log 2>&1 \
            || { cat upload.log; bash ../.github/report.sh upload.log; exit 1; }
          cat upload.log
          echo "::notice::Mac yapısı $GITHUB_RUN_NUMBER yüklendi."
