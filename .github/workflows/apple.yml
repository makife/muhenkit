name: Apple

on:
  push:
    branches: [main]
    paths: ["apple/**", "core/**", ".github/workflows/apple.yml", ".github/report.sh"]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - name: Xcode projesi uret
        working-directory: apple
        run: |
          brew install xcodegen
          xcodegen generate
      - name: macOS uygulamasi
        working-directory: apple
        run: |
          xcodebuild -project MuhenKit.xcodeproj -scheme MuhenKit-macOS -configuration Release \
            -derivedDataPath build -destination 'generic/platform=macOS' \
            CODE_SIGN_IDENTITY=- CODE_SIGNING_REQUIRED=NO build > mac.log 2>&1 || { bash ../.github/report.sh mac.log; exit 1; }
          ditto -c -k --keepParent build/Build/Products/Release/MuhenKit.app MuhenKit-macOS.zip
      - name: iOS (imzasiz derleme denetimi)
        working-directory: apple
        run: |
          xcodebuild -project MuhenKit.xcodeproj -scheme MuhenKit-iOS -configuration Release \
            -derivedDataPath build -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO build > ios.log 2>&1 || { bash ../.github/report.sh ios.log; exit 1; }
      - uses: actions/upload-artifact@v5
        with:
          name: MuhenKit-macOS
          path: apple/MuhenKit-macOS.zip
